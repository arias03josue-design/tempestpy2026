<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1638"/>
      <stop offset="1" stop-color="#0a0b15"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".36"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity=".08"/>
    </pattern>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272b4a"/>
      <stop offset="1" stop-color="#13162a"/>
    </linearGradient>
    <pattern id="keys" x="160" y="232" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="34" height="34" rx="7" fill="#1d2140" stroke="#a855f7" stroke-opacity=".55" stroke-width="1.5"/>
      <rect x="8" y="7" width="24" height="21" rx="5" fill="#2a2f55"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <ellipse cx="400" cy="330" rx="380" ry="250" fill="url(#halo)"/>

  <path d="M386 212C380 150 448 104 560 92S700 72 790 30" fill="none" stroke="#2a2f55" stroke-width="10" stroke-linecap="round"/>

  <g transform="rotate(-7 400 330)">
    <rect x="124" y="214" width="552" height="244" rx="30" fill="url(#rgb)" opacity=".75" filter="url(#blur)"/>
    <rect x="130" y="210" width="540" height="240" rx="26" fill="url(#case)" stroke="url(#rgb)" stroke-width="3"/>
    <rect x="160" y="232" width="440" height="160" fill="url(#keys)"/>

    <circle cx="632" cy="256" r="17" fill="#1d2140" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/>
    <line x1="632" y1="244" x2="632" y2="252" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
    <g fill="#1d2140" stroke="#a855f7" stroke-opacity=".55" stroke-width="1.5">
      <rect x="613" y="283" width="34" height="34" rx="7"/>
      <rect x="613" y="323" width="34" height="34" rx="7"/>
      <rect x="613" y="363" width="34" height="34" rx="7"/>
      <rect x="163" y="395" width="54" height="34" rx="7"/>
      <rect x="223" y="395" width="54" height="34" rx="7"/>
      <rect x="503" y="395" width="54" height="34" rx="7"/>
      <rect x="563" y="395" width="84" height="34" rx="7"/>
    </g>
    <rect x="283" y="395" width="214" height="34" rx="8" fill="#22264a" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>

    <rect x="163" y="235" width="34" height="34" rx="7" fill="#ff0055" filter="url(#glow)"/>
    <g fill="#00f0ff" filter="url(#glow)">
      <rect x="243" y="275" width="34" height="34" rx="7"/>
      <rect x="203" y="315" width="34" height="34" rx="7"/>
      <rect x="243" y="315" width="34" height="34" rx="7"/>
      <rect x="283" y="315" width="34" height="34" rx="7"/>
    </g>
  </g>

  <rect x="648" y="118" width="32" height="32" rx="7" fill="#1d2140" stroke="#a855f7" stroke-width="2" transform="rotate(20 664 134)" opacity=".85"/>
  <rect x="104" y="478" width="26" height="26" rx="6" fill="#1d2140" stroke="#00f0ff" stroke-width="2" transform="rotate(-16 117 491)" opacity=".75"/>
  <text x="40" y="568" font-family="Consolas, monospace" font-size="16" letter-spacing="5" fill="#a855f7" fill-opacity=".75">75% · HOT-SWAP · RGB</text>
</svg>
