<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22142f"/>
      <stop offset="1" stop-color="#0b0c16"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="44%" r="48%">
      <stop offset="0" stop-color="#ffc53d" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#ff0055" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff0055" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffc53d" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2d6f"/>
      <stop offset="1" stop-color="#6d1bc7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc53d"/>
      <stop offset=".5" stop-color="#ff0055"/>
      <stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="400" cy="270" r="260" fill="url(#halo)"/>
  <circle cx="400" cy="250" r="150" fill="none" stroke="#ffc53d" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="400" cy="250" r="176" fill="none" stroke="#ff0055" stroke-opacity=".16" stroke-width="1.5" stroke-dasharray="4 10"/>

  <!-- Pedestal -->
  <ellipse cx="400" cy="508" rx="192" ry="34" fill="#0d1020" stroke="url(#ring)" stroke-width="4" filter="url(#glow)"/>
  <ellipse cx="400" cy="499" rx="160" ry="23" fill="#1b1f38"/>

  <!-- Katana on the back -->
  <g transform="rotate(-36 400 330)">
    <rect x="150" y="324" width="430" height="10" rx="5" fill="#e3ebff"/>
    <rect x="150" y="327" width="430" height="3" fill="#00f0ff" filter="url(#glow)"/>
    <rect x="576" y="317" width="14" height="24" rx="3" fill="#ffc53d"/>
    <rect x="590" y="321" width="86" height="16" rx="6" fill="#2a1840" stroke="#ffc53d" stroke-width="2"/>
  </g>

  <!-- Ponytail -->
  <path d="M352 205 Q298 252 316 336" fill="none" stroke="#3b2a6b" stroke-width="24" stroke-linecap="round"/>

  <!-- Sleeves and robe -->
  <path d="M334 304 262 422 300 440 352 354Z" fill="#c21f6a" stroke="#ff6b9a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M466 304 538 422 500 440 448 354Z" fill="#c21f6a" stroke="#ff6b9a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M332 300Q400 282 468 300L522 488Q400 512 278 488Z" fill="url(#robe)" stroke="#ff6b9a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M360 300 400 374 440 300" fill="none" stroke="#f6f3ff" stroke-width="10" stroke-linejoin="round"/>
  <rect x="306" y="394" width="188" height="26" rx="6" fill="#ffc53d"/>
  <rect x="388" y="388" width="24" height="38" rx="5" fill="#ff0055"/>

  <!-- Fox mask head -->
  <path d="M346 214 332 128 388 178Z" fill="#f6f3ff" stroke="#ff0055" stroke-width="4" stroke-linejoin="round"/>
  <path d="M454 214 468 128 412 178Z" fill="#f6f3ff" stroke="#ff0055" stroke-width="4" stroke-linejoin="round"/>
  <path d="M347 150 360 190 376 176Z" fill="#ff0055" opacity=".75"/>
  <path d="M453 150 440 190 424 176Z" fill="#ff0055" opacity=".75"/>
  <ellipse cx="400" cy="238" rx="66" ry="62" fill="#f6f3ff"/>
  <path d="M356 232Q374 218 392 236" fill="none" stroke="#ff0055" stroke-width="6" stroke-linecap="round"/>
  <path d="M444 232Q426 218 408 236" fill="none" stroke="#ff0055" stroke-width="6" stroke-linecap="round"/>
  <path d="M372 204Q400 194 428 204" fill="none" stroke="#ffc53d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="268" r="7" fill="#1a1d2d"/>
  <path d="M380 284Q400 296 420 284" fill="none" stroke="#ff0055" stroke-width="4" stroke-linecap="round"/>

  <!-- Sparkles -->
  <g fill="#ffc53d" filter="url(#glow)">
    <path d="M168 150l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
    <path d="M642 196l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
    <path d="M612 420l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
  </g>
  <text x="40" y="568" font-family="Consolas, monospace" font-size="16" letter-spacing="5" fill="#ffc53d" fill-opacity=".7">LIMITED · SCALE 1/7</text>
</svg>
