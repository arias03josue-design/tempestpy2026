# TEMPEST Store · Nginx (host) → Docker container on 127.0.0.1
#
# 1. Replace tienda.tudominio.com (and 5001 if you changed TEMPEST_HTTP_PORT).
# 2. sudo cp deploy/nginx/tempest.conf /etc/nginx/sites-available/tempest.conf
#    sudo ln -s /etc/nginx/sites-available/tempest.conf /etc/nginx/sites-enabled/tempest.conf
#    sudo nginx -t && sudo systemctl reload nginx
# 3. HTTPS: sudo certbot --nginx -d tienda.tudominio.com   (adds the 443 block and the redirect)

upstream tempest_store {
    server 127.0.0.1:5001;
    # Reuse connections to Kestrel instead of opening one per request.
    keepalive 16;
}

# WebSocket upgrade for the admin panel (Blazor Server runs over SignalR);
# an empty Connection header keeps the upstream keep-alive working for everything else.
map $http_upgrade $tempest_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name tienda.tudominio.com;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://tempest_store;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $tempest_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming rendering: the catalog sends the skeletons first and the cards later,
        # in the same response. Buffering would hold everything until the end.
        proxy_buffering off;

        # The admin WebSocket stays open (SignalR pings every 15 s).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
